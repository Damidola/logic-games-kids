<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>8 ферзів</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790234762">
  <link rel="stylesheet" href="../shared/play.css?v=1790234762">
  <style>
    .qn-status { display: flex; gap: 8px; justify-content: center; }
    .chip { font-weight: 800; font-size: 15px; padding: 5px 12px; border-radius: 999px; background: var(--lg-surface); border: 2px solid var(--lg-line); color: var(--lg-ink); }
    .chip.bad { background: #FFD1D1; border-color: #E0302E; color: #9b1c1c; }
    .qn-play .lg-board-wrap { width: min(100vw, 560px, calc(100svh - var(--lg-bar-h) - 16px - 40px - 70px - 60px - 30px)); }
    .qn-tray { display: flex; justify-content: center; gap: 2px; min-height: 52px; width: min(100vw, 560px); padding: 4px 8px; box-sizing: border-box; border-radius: 14px; background: var(--lg-surface); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
    .qn-tray mpiece { display: block; width: calc(min(100vw, 560px) / 9.5); max-width: 56px; aspect-ratio: 1; background-size: cover; cursor: grab; transition: transform .12s ease; }
    .qn-tray.done:empty::after { content: '✅'; font-size: 30px; }
    cg-board square.q-att { background: rgba(231, 76, 60, .18); }
    cg-board square.q-bad { background: rgba(231, 76, 60, .6); }
    cg-board square.q-hint { box-shadow: inset 0 0 0 5px #FF9F1C; animation: qnglow .9s ease-in-out 3; }
    @keyframes qnglow { 50% { background: rgba(255, 159, 28, .45); } }
    .qn-play { justify-content: center; gap: 10px; }
    .qn-play .lg-controls { grid-template-columns: repeat(5, 1fr); width: min(100%, 480px); }
    .qn-tog { opacity: .55; }
    .qn-tog.is-on { opacity: 1; background: var(--lg-primary) !important; color: #fff !important; border-color: #5646D6 !important; }
    .qn-tog.confirm { opacity: 1; outline: 3px dashed #FF9F1C; outline-offset: 1px; }
  </style>
</head>
<body>
  <main class="lg-play qn-play">
    <div class="qn-status"><span class="chip" id="left">Ферзів: 0 / 8</span></div>
    <div class="lg-board-wrap"><div class="lg-board-el" id="board"></div></div>
    <div class="qn-tray" id="tray" aria-label="Ферзі, яких ще треба поставити"></div>
    <div class="lg-controls">
      <button type="button" id="new"><span class="ico">🔄</span><span class="lbl">Заново</span></button>
      <button type="button" id="hint"><span class="ico">💡</span><span class="lbl">Підказка</span></button>
      <button type="button" id="undo"><span class="ico">↩️</span><span class="lbl">Назад</span></button>
      <button type="button" id="att" class="qn-tog"><span class="ico">👁️</span><span class="lbl">Підсвітка</span></button>
      <button type="button" id="free" class="qn-tog"><span class="ico">🔓</span><span class="lbl">Вільно</span></button>
    </div>
  </main>
  <script src="../shared/games.js?v=1790234762"></script>
  <script src="../shared/kit.js?v=1790234762" data-game="queens" data-night="on"></script>
  <script type="module" src="queens.js?v=1790234762"></script>
</body>
</html>
