<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Чотири в ряд</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790255828">
  <link rel="stylesheet" href="../shared/play.css?v=1790255828">
  <style>
    .lg-custom-view .lg-board-wrap { width: min(96vw, 520px, calc((100svh - var(--lg-bar-h) - 16px - 170px - 60px) * 7 / 6)); aspect-ratio: 7 / 6; }
    .c4-board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1.4%; padding: 1.8%; box-sizing: border-box; background: #3B5BDB; border-radius: 22px; }
    .c4-col { display: grid; grid-template-rows: repeat(6, minmax(0, 1fr)); gap: 3%; min-height: 0; border-radius: 14px; padding: 4% 0; cursor: pointer; }
    .c4-col.free:active { background: rgba(255, 255, 255, .18); }
    .c4-col.hinted { background: rgba(255, 159, 28, .45); animation: glow 1s ease-in-out 3; }
    .c4-cell { height: 100%; aspect-ratio: 1; max-width: 100%; justify-self: center; min-height: 0; border-radius: 50%; background: #FFF7EC; box-shadow: inset 0 4px 0 rgba(0, 0, 0, .15); }
    .c4-cell.w { background: radial-gradient(circle at 35% 30%, #FFA3A3 0 22%, #FF6B6B 60%); }
    .c4-cell.b { background: radial-gradient(circle at 35% 30%, #FFE08A 0 22%, #FFB300 60%); }
    .c4-cell.drop { animation: drop .35s cubic-bezier(.3, 1.4, .5, 1); }
    .c4-cell.win { box-shadow: 0 0 0 4px #fff, 0 0 14px 4px rgba(255, 255, 255, .8); }
    @keyframes drop { from { transform: translateY(-300%); } }
    @keyframes glow { 50% { background: rgba(255, 159, 28, .15); } }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) { html.lg .lg-play > .lg-board-wrap { width: min(var(--lg-bh) * 7 / 6, var(--lg-bw)); } }
  </style>
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790255828"></script>
  <script src="../shared/kit.js?v=1790255828" data-game="connect4" data-night="on"></script>
  <script type="module">
    import { startGame } from '../shared/game.js?v=1790255828';
    import { createRules } from './rules.js?v=1790255828';
    import { connect4View } from './view.js?v=1790255828';
    startGame({ rules: createRules(), view: connect4View, sideNames: { w: '🔴 Червоні', b: '🟡 Жовті' } });
  </script>
</body>
</html>
