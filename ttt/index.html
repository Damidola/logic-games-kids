<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Хрестики-нулики</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790163047">
  <link rel="stylesheet" href="../shared/play.css?v=1790163047">
  <style>
    .ttt-board { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3%; padding: 3%; box-sizing: border-box; background: var(--lg-ink); border-radius: 26px; }
    html.lg-night .ttt-board { background: #3a3850; }
    .ttt-cell { border: 0; border-radius: 18px; background: #fff; font: 900 clamp(48px, 18vw, 96px)/1 var(--lg-font); cursor: pointer; padding: 0; }
    .ttt-cell.w { color: #4DA3FF; animation: pop .25s cubic-bezier(.2, 1.8, .4, 1); }
    .ttt-cell.b { color: #FF6B6B; animation: pop .25s cubic-bezier(.2, 1.8, .4, 1); }
    .ttt-cell.free:active { transform: scale(.95); }
    .ttt-cell.hinted { box-shadow: inset 0 0 0 6px #FF9F1C; animation: glow 1s ease-in-out 3; }
    @keyframes pop { from { transform: scale(.3); } }
    @keyframes glow { 50% { background: #FFE9C7; } }
    .ttt-line { position: absolute; inset: 3%; width: 94%; height: 94%; pointer-events: none; display: none; }
    .ttt-line.on { display: block; }
    .ttt-line line { stroke-width: .16; stroke-linecap: round; stroke: #1E6FD9; }
    .ttt-line[data-who="b"] line { stroke: #D63031; }
    .lg-custom-view .lg-board-wrap { width: min(92vw, 420px, calc(100svh - var(--lg-bar-h) - 16px - 170px - 60px)); }
  </style>
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790163047"></script>
  <script src="../shared/kit.js?v=1790163047" data-game="ttt" data-night="on"></script>
  <script type="module">
    import { startGame } from '../shared/game.js?v=1790163047';
    import { createRules } from './rules.js?v=1790163047';
    import { tttView } from './view.js?v=1790163047';
    // Гра швидка: вікно результату зникає через 2 с, і одразу нова партія
    startGame({ rules: createRules(), view: tttView, autoClose: 2000 });
  </script>
</body>
</html>
