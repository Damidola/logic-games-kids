<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переправа</title>
    <link rel="stylesheet" href="../shared/kit.css?v=1790143292">
    <link rel="stylesheet" href="style.css?v=1790143292">
</head>
<body>

    <p class="goal">🦎 Доведи саламандру до <b>зеленого берега</b> 🌿</p>

    <div id="game-container">
        <div id="game-board"></div>
        <!-- Pieces will be added here by JavaScript -->
        <div class="game-overlay"></div>
    </div>

    <button id="reset-button">🔄 Почати знову</button>

    <!-- Victory and defeat windows -->
    <div class="victory-window" id="victory-window">
        <h2>Ти виграв!</h2>
        <p>Вітаємо з перемогою!</p>
        <button id="victory-play-again">Грати знову</button>
    </div>

    <div class="victory-window defeat" id="defeat-window">
        <h2>Ти програв!</h2>
        <p>Спробуй ще раз!</p>
        <button id="defeat-play-again">Грати знову</button>
    </div>

    <script src="../shared/games.js?v=1790143292"></script>
    <script src="../shared/kit.js?v=1790143292" data-game="salamandra"></script>
    <script src="js1.js?v=1790143292"></script>

</body>
</html>
