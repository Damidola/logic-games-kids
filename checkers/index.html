<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Шашки</title>
    <link rel="stylesheet" href="../shared/kit.css?v=1790156893">
    <link rel="stylesheet" href="style.css?v=1790156893">
</head>
<body>
    <h1 class="lg-hide">Шашки</h1>
    
    <div id="checkerboard" class="checkerboard"></div>
    
    <div class="game-controls">
        <button id="new-game-btn">✨ Нова гра</button>
        <button id="undo-btn" class="icon-btn" title="Скасувати хід" aria-label="Скасувати хід">↩️</button>
        <div class="theme-selector">
            <button id="theme-btn" title="Змінити кольори дошки" aria-label="Змінити кольори дошки"></button>
            <div class="theme-dropdown" id="theme-dropdown">
                <div class="theme-option" data-theme="default"></div>
                <div class="theme-option" data-theme="dark"></div>
                <div class="theme-option" data-theme="neon"></div>
                <div class="theme-option" data-theme="green"></div>
                <div class="theme-option" data-theme="yellow"></div>
            </div>
        </div>
    </div>
    
    <!-- Add modal window for game result -->
    <div id="game-result-modal" class="modal">
        <div class="modal-content">
            <h2 id="game-result-text"></h2>
            <button id="modal-new-game-btn">Нова гра</button>
        </div>
    </div>
    <script src="../shared/games.js?v=1790156893"></script>
    <script src="../shared/kit.js?v=1790156893" data-game="checkers"></script>
    <script src="script.js?v=1790156893"></script>
</body>
</html>
