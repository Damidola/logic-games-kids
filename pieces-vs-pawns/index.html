<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Фігури й пішаки</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790259921">
  <link rel="stylesheet" href="../shared/play.css?v=1790259921">
  <link rel="stylesheet" href="../shared/pieces/extra.css?v=1790259921">
  <style>
    /* 7 режимів — 2 ряди по сітці (4 + 3) на всю ширину: не переносяться в третій ряд за будь-якого шрифту */
    html.lg .lg-play > .lg-quick { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; padding: 2px; width: min(100%, 560px); max-width: none; box-sizing: border-box; }
    html.lg .lg-quick button { grid-column: span 3; display: flex; align-items: center; justify-content: center; gap: 0; min-width: 0; min-height: 28px; padding: 1px 2px; white-space: nowrap; overflow: hidden; }
    html.lg .lg-quick button:nth-child(n+5) { grid-column: span 4; }
    .lg-quick mpiece { display: inline-block; flex: none; width: 19px; height: 19px; background-size: cover; }
    .lg-quick small { font-size: 11px; font-weight: 900; margin: 0 1px; }
    .lg-quick small.vs { opacity: .7; margin: 0 2px; }
    .lg-hero-slot { min-height: 64px; }
    .lg-quick button[aria-checked="true"] small { color: #fff; }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) { .lg-quick mpiece { width: 26px; height: 26px; } .lg-quick small { font-size: 13px; } }
  </style>
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790259921"></script>
  <script src="../shared/kit.js?v=1790259921" data-game="wolfs" data-night="on"></script>
  <script type="module">
    import { startGame } from '../shared/game.js?v=1790259921';
    import { createRules, MODES, modeButton, modeLabel } from './rules.js?v=1790259921';
    // Посилання з уроків: pieces-vs-pawns/#r_p5 — одразу потрібний режим
    const fromHash = location.hash.slice(1);
    if (MODES.some(m => m[0] === fromHash)) LG.store.set('wolfs:mode2', fromHash);
    startGame({
      rules: createRules({ mode: () => LG.store.get('wolfs:mode2', 'q_p8') }),
      player: 'b', // за замовчуванням дитина грає фігурами (чорними)
      quick: { key: 'wolfs:mode2', def: 'q_p8', options: MODES.map(m => [m[0], modeButton(m)]) }
    });
    document.querySelectorAll('.lg-quick button').forEach(b => { const m = MODES.find(x => x[0] === b.dataset.v); b.title = modeLabel(m); b.setAttribute('aria-label', modeLabel(m)); });
  </script>
</body>
</html>
