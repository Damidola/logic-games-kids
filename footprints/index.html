<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Сліди</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790198841">
  <link rel="stylesheet" href="../shared/play.css?v=1790198841">
  <link rel="stylesheet" href="../shared/pieces/extra.css?v=1790198841">
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790198841"></script>
  <script src="../shared/kit.js?v=1790198841" data-game="footprints" data-night="on"></script>
  <script type="module">
    import { startGame } from '../shared/game.js?v=1790198841';
    import { createRules } from './rules.js?v=1790198841';
    let game;
    game = startGame({
      rules: createRules({ random: () => LG.store.get('footprints:random', false) }),
      extraSettings: () => {
        const l = document.createElement('label'); l.className = 'lg-set-row';
        l.innerHTML = `<span>Випадкові місця тур</span><input type="checkbox" ${LG.store.get('footprints:random', false) ? 'checked' : ''}>`;
        l.querySelector('input').addEventListener('change', e => { LG.store.set('footprints:random', e.target.checked); game.newGame(); });
        return l;
      }
    });
  </script>
</body>
</html>
