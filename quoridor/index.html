<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Коридор</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790201004">
  <link rel="stylesheet" href="../shared/play.css?v=1790201004">
  <style>
    .lg-custom-view .lg-board-wrap { width: min(96vw, 500px, calc(100svh - var(--lg-bar-h) - 16px - 150px - 60px)); }
    .qr-board { --n: 9; position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); aspect-ratio: 1; background: #6B4226; border-radius: 14px; padding: 0; box-sizing: border-box; touch-action: manipulation; cursor: pointer; }
    .qr-cell { position: relative; margin: 9%; border-radius: 6px; background: #C8955E; display: grid; place-items: center; }
    .qr-cell.goal-w { background: #9fc3ff; } .qr-cell.goal-b { background: #ffb3b3; }
    .qr-cell.free::after { content: ''; width: 34%; height: 34%; border-radius: 50%; background: rgba(0, 0, 0, .3); }
    .qr-cell.last { box-shadow: inset 0 0 0 3px #FFC928; }
    .qr-cell.hinted { box-shadow: inset 0 0 0 4px #FF9F1C; animation: qrglow 1s ease-in-out 3; }
    @keyframes qrglow { 50% { background: #ffe0a8; } }
    .qr-pawn { width: 74%; height: 74%; border-radius: 50%; box-shadow: 0 3px 4px rgba(0, 0, 0, .45), inset 0 -4px 0 rgba(0, 0, 0, .25); }
    .qr-pawn.w { background: radial-gradient(circle at 35% 30%, #8fb8ff, #2563EB 70%); }
    .qr-pawn.b { background: radial-gradient(circle at 35% 30%, #ff9b9b, #DC2626 70%); }
    .qr-layer { position: absolute; inset: 0; pointer-events: none; }
    .qr-wall { position: absolute; border-radius: 4px; background: #F5E6C8; box-shadow: 0 2px 3px rgba(0, 0, 0, .5); }
    .qr-wall.h { width: calc(200% / var(--n)); height: calc(18% / var(--n)); transform: translateY(-50%); }
    .qr-wall.v { height: calc(200% / var(--n)); width: calc(18% / var(--n)); transform: translateX(-50%); }
    .qr-wall.last { background: #FFC928; }
    .qr-wall.preview.ok { background: rgba(46, 204, 113, .85); animation: qrpulse .8s ease-in-out infinite alternate; }
    .qr-wall.preview.bad { background: rgba(231, 76, 60, .85); }
    .qr-wall.preview.hinted { background: #FF9F1C; }
    @keyframes qrpulse { to { opacity: .45; } }
    .lg-material .qr-sc { display: flex; align-items: center; gap: 6px; font-size: 17px; }
    .lg-material .qr-sc i { width: 18px; height: 18px; border-radius: 50%; background: #2563EB; }
    .lg-material .qr-sc.b i { background: #DC2626; }
  </style>
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790201004"></script>
  <script src="../shared/kit.js?v=1790201004" data-game="quoridor" data-night="on"></script>
  <script type="module">
    import { startGame, choice } from '../shared/game.js?v=1790201004';
    import { createRules } from './rules.js?v=1790201004';
    import { quoridorView } from './view.js?v=1790201004';
    let game;
    game = startGame({
      rules: createRules({ size: () => LG.store.get('quoridor:size', '9') }),
      view: quoridorView,
      sideNames: { w: '🔵 Сині', b: '🔴 Червоні' },
      quick: { key: 'quoridor:size', def: '9', options: [['5', '5×5'], ['7', '7×7'], ['9', '9×9']] },
      extraSettings: choice('Поле', 'quoridor:size', '9', [['5', '5×5 · 5 стінок'], ['7', '7×7 · 8 стінок'], ['9', '9×9 · 10 стінок']], () => game.newGame())
    });
  </script>
</body>
</html>
