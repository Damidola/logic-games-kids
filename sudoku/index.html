<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Звірячі судоку</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
  <link rel="stylesheet" href="../shared/kit.css?v=1790255423">
  <link rel="stylesheet" href="style.css?v=1790255423">
</head>
<body>
  <main class="sd">
    <section class="sd-setup" aria-label="Налаштування гри">
      <div class="seg" role="radiogroup" aria-label="Розмір поля" id="size">
        <button type="button" role="radio" data-size="3">3×3</button>
        <button type="button" role="radio" data-size="4">4×4</button>
        <button type="button" role="radio" data-size="5">5×5</button>
        <button type="button" role="radio" data-size="6">6×6</button>
        <button type="button" role="radio" data-size="9">9×9</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="Складність" id="level">
        <button type="button" role="radio" data-level="0" title="Дуже легко">1</button>
        <button type="button" role="radio" data-level="1" title="Легко">2</button>
        <button type="button" role="radio" data-level="2" title="Середньо">3</button>
        <button type="button" role="radio" data-level="3" title="Складно">4</button>
        <button type="button" role="radio" data-level="4" title="Дуже складно">5</button>
      </div>
    </section>

    <div class="sd-status">
      <span id="progress" class="chip">🐾 0/0</span>
      <span id="timer" class="chip" title="Час">⏱ 0:00</span>
      <span id="hintsUsed" class="chip" title="Лишилось підказок">💡 3</span>
    </div>

    <div class="sd-board-wrap">
      <div id="board" class="sd-board" role="grid" aria-label="Поле судоку"></div>
    </div>

    <div id="palette" class="sd-palette" aria-label="Звірята"></div>

    <div class="lg-controls">
      <button type="button" id="new"><span class="ico">🔄</span><span class="lbl">Нова гра</span></button>
      <button type="button" id="hint"><span class="ico">💡</span><span class="lbl">Підказка</span></button>
    </div>
  </main>

  <script src="../shared/games.js?v=1790255423"></script>
  <script src="../shared/kit.js?v=1790255423" data-game="sudoku"></script>
  <script src="sudoku.js?v=1790255423"></script>
</body>
</html>
