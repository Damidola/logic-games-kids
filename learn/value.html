<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Цінність фігур</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790201216">
  <link rel="stylesheet" href="../shared/play.css?v=1790201216">
  <style>
    .vl { justify-content: center; gap: 8px; }
    .vl-intro { flex: 1 1 auto; min-height: 0; overflow-y: auto; width: 100%; max-width: 620px; padding: 6px 14px; box-sizing: border-box; color: var(--lg-ink); text-align: center; }
    .vl-intro h2 { margin: 6px 0 4px; font: 900 24px var(--lg-font); }
    .vl-intro p { margin: 8px 0; font: 700 16px/1.4 var(--lg-font); color: var(--lg-ink); }
    .vl-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .vl-card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 16px; background: var(--lg-surface); border: 2px solid var(--lg-line); }
    .vl-card mpiece { display: block; width: 58px; height: 58px; background-size: cover; }
    .vl-card b { font: 900 26px var(--lg-font); color: var(--lg-primary); }
    .vl-card span { font: 800 13px var(--lg-font); color: var(--lg-muted); }
    .vl-go { margin-top: 8px; min-width: 200px; min-height: 52px; border: 0; border-radius: 16px; background: var(--lg-primary); color: #fff; font: 900 20px var(--lg-font); cursor: pointer; box-shadow: 0 4px 0 #5646D6; }
    .vl-goal { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font: 900 17px var(--lg-font); color: var(--lg-ink); text-align: center; }
    .vl-legend { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .vl-legend span { display: inline-flex; align-items: center; gap: 1px; padding: 1px 7px 1px 2px; border-radius: 999px; background: var(--lg-surface); border: 2px solid var(--lg-line); font: 900 14px var(--lg-font); color: var(--lg-ink); }
    .vl-legend mpiece { display: inline-block; width: 24px; height: 24px; background-size: cover; }
    .vl-task { min-height: 42px; max-width: min(100%, 520px); padding: 0 12px; text-align: center; font: 800 15px/1.35 var(--lg-font); color: var(--lg-ink); }
    .vl-task.ok { color: #2ECC9A; } .vl-task.bad { color: #FF9F1C; }
    .vl .lg-board-wrap { width: min(100vw, 560px, calc(100svh - var(--lg-bar-h) - 16px - 60px - 40px - 50px - 60px)); }
    .vl .lg-board-wrap.solved cg-board { box-shadow: 0 0 0 5px #2ECC9A; }
    .vl .lg-controls { grid-template-columns: repeat(3, 1fr); width: min(100%, 420px); }
    .vl[data-step="intro"] > :not(.vl-intro) { display: none !important; }
    .vl:not([data-step="intro"]) > .vl-intro { display: none; }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) { html.lg .lg-play.vl[data-step="intro"] { display: flex; width: 100%; } }
  </style>
</head>
<body>
  <main class="lg-play vl" data-step="intro">
    <section class="vl-intro">
      <h2>Скільки коштують фігури?</h2>
      <p>У шахах кожна фігура має свою «ціну» в очках. Пішак — найдешевший, ферзь — найдорожчий. Король безцінний: без нього гра закінчується.</p>
      <div class="vl-cards">
        <div class="vl-card"><mpiece class="pawn white"></mpiece><b>1</b><span>пішак</span></div>
        <div class="vl-card"><mpiece class="knight white"></mpiece><b>3</b><span>кінь</span></div>
        <div class="vl-card"><mpiece class="bishop white"></mpiece><b>3</b><span>слон</span></div>
        <div class="vl-card"><mpiece class="rook white"></mpiece><b>5</b><span>тура</span></div>
        <div class="vl-card"><mpiece class="queen white"></mpiece><b>9</b><span>ферзь</span></div>
        <div class="vl-card"><mpiece class="king white"></mpiece><b>∞</b><span>король</span></div>
      </div>
      <p>Якщо можна побити кілька фігур суперника — <b>бий найдорожчу!</b></p>
      <button type="button" class="vl-go" id="go">Спробувати ▶️</button>
    </section>
    <div class="vl-goal"><span id="goal">Побий найдорожчу фігуру</span><span class="chip" id="count"></span></div>
    <div class="vl-legend" id="legend"></div>
    <div class="lg-board-wrap" id="wrap"><div class="lg-board-el" id="board"></div></div>
    <div class="vl-task" id="task"></div>
    <div class="lg-controls">
      <button type="button" id="back"><span class="ico">🎓</span><span class="lbl">Уроки</span></button>
      <button type="button" id="intro"><span class="ico">📖</span><span class="lbl">Ціни фігур</span></button>
      <button type="button" id="skip"><span class="ico">▶️</span><span class="lbl">Далі</span></button>
    </div>
  </main>
  <script src="../shared/games.js?v=1790201216"></script>
  <script src="../shared/kit.js?v=1790201216" data-game="learn" data-night="on"></script>
  <script type="module" src="value.js?v=1790201216"></script>
</body>
</html>
