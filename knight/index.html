<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Хід конем</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790199770">
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    html.lg body.lg-game { position: fixed; inset: 0; margin: 0; height: 100svh; min-height: 0; padding: calc(var(--lg-bar-h) + 10px) 0 10px; }
    .kt { max-width: 560px; height: 100%; margin: 0 auto; padding: 0 10px 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 16px; background: var(--lg-surface); border: 2px solid var(--lg-line); }
    .seg button { min-width: 50px; min-height: 40px; padding: 4px 8px; border: 0; border-radius: 12px; font: 900 16px var(--lg-font); color: var(--lg-ink); background: transparent; cursor: pointer; }
    .seg button[aria-checked="true"] { background: var(--lg-primary); color: #fff; }
    .chip { font-weight: 800; font-size: 15px; padding: 5px 12px; border-radius: 999px; background: var(--lg-surface); border: 2px solid var(--lg-line); font-variant-numeric: tabular-nums; color: var(--lg-ink); }
    .kt-board { --n: 5; --size: min(100vw - 20px, 540px, calc(100svh - var(--lg-bar-h) - 250px)); width: var(--size); height: var(--size); display: grid; grid-template-columns: repeat(var(--n), 1fr); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 22px rgba(0, 0, 0, .3); }
    .kt-sq { position: relative; display: grid; place-items: center; border: 0; padding: 0; background: #f0d9b5; font: 900 calc(var(--size) / var(--n) * .34) var(--lg-font); color: rgba(0, 0, 0, .45); cursor: pointer; }
    .kt-sq.d { background: #b58863; }
    .kt-sq.seen { background: #9fd8b8; color: #1d5b3b; }
    .kt-sq.seen.d { background: #7cc39c; }
    .kt-sq.can::after { content: ''; position: absolute; width: 32%; height: 32%; border-radius: 50%; background: rgba(20, 85, 30, .5); }
    .kt-sq.hint::after { background: #FF9F1C; box-shadow: 0 0 0 4px rgba(255, 159, 28, .45); animation: kthint .8s ease-in-out 3; }
    @keyframes kthint { 50% { transform: scale(1.3); } }
    .kt-sq mpiece { position: absolute; inset: 4%; background-size: cover; transition: transform .15s ease; }
    .kt-sq.stuck mpiece { animation: ktstuck .4s ease 2; }
    @keyframes ktstuck { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
    .kt-task { min-height: 20px; text-align: center; font: 800 15px/1.3 var(--lg-font); color: var(--lg-ink); padding: 0 8px; }
    .kt .lg-controls { grid-template-columns: repeat(3, 1fr); width: min(100%, 420px); }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
      .kt { max-width: none; }
      .kt-board { --size: min(calc(100svh - var(--lg-bar-h) - 230px), 820px); }
      .kt .lg-controls { width: min(100%, 520px); }
    }
  </style>
</head>
<body>
  <main class="kt">
    <div class="seg" role="radiogroup" aria-label="Розмір дошки" id="size"></div>
    <span class="chip" id="count">1 / 25</span>
    <div class="kt-board" id="board" role="grid" aria-label="Дошка"></div>
    <div class="kt-task" id="task">Обійди конем усі клітинки — на кожну ставай лише раз.</div>
    <div class="lg-controls">
      <button type="button" id="new"><span class="ico">🔄</span><span class="lbl">Заново</span></button>
      <button type="button" id="hint"><span class="ico">💡</span><span class="lbl">Підказка</span></button>
      <button type="button" id="undo"><span class="ico">↩️</span><span class="lbl">Назад</span></button>
    </div>
  </main>
  <script src="../shared/games.js?v=1790199770"></script>
  <script src="../shared/kit.js?v=1790199770" data-game="knight" data-night="on"></script>
  <script type="module" src="knight.js?v=1790199770"></script>
</body>
</html>
