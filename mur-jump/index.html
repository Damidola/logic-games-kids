<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e7f0ed"><title>Мурчик Jump</title><meta name="description" content="Котик, єдинороги та ціле небо. Грай нахилом телефона!"><link rel="stylesheet" href="style.css?v=20261024"></head>
<body><main class="game-screen" aria-label="Мурчик Jump"><canvas id="game" width="420" height="720" aria-label="Гра зі стрибками. Керуй нахилом телефона, пальцем або стрілками."></canvas>
<div class="characters" role="group" aria-label="Вибір персонажа"><button class="character selected" data-hero="cat" aria-pressed="true" aria-label="Грати котиком Мурчиком" title="Мурчик"><canvas id="cat-portrait" width="100" height="100" aria-hidden="true"></canvas></button><button class="character" data-hero="unicorn" aria-pressed="false" aria-label="Грати єдинорогом Зірочкою" title="Зірочка"><span aria-hidden="true">🦄</span></button></div>
<div class="game-actions"><button id="sound" aria-label="Вимкнути музику" aria-pressed="true" title="Музика"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg></button><button id="pause" aria-label="Пауза" title="Пауза (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></div>
<div class="hud"><div><small>ВИСОТА</small><strong><span id="height">0</span><em> м</em></strong></div><div class="star-count">✦ <span id="stars">0</span></div><div class="record"><small>РЕКОРД</small><strong><span id="best">0</span><em> м</em></strong></div></div>
<div class="overlay" id="overlay"><div class="overlay-card"><div class="overlay-stars" aria-hidden="true">✧ <span>✦</span> ✧</div><h1 id="overlay-title">Мурчик Jump</h1><p id="overlay-text">Стрибай по хмаринках.<br>Збирай зірки. Лети вище.</p><button class="play" id="play">Полетіли!</button><button class="restart" id="restart" hidden>Почати заново</button><a class="home-link" href="../index.html">До списку ігор</a><small id="overlay-hint">Нахиляй телефон ліворуч / праворуч<br>На комп’ютері — стрілки ← →</small></div></div><small id="tilt-status" class="sr-only" role="status"></small></main><script src="../shared/kit.js?v=1790430643"></script><script type="module" src="game.js?v=20261024"></script></body></html>
