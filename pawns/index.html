<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Пішаки</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790200506">
  <link rel="stylesheet" href="../shared/play.css?v=1790200506">
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790200506"></script>
  <script src="../shared/kit.js?v=1790200506" data-game="pawns" data-night="on"></script>
  <script type="module">
    import { startGame } from '../shared/game.js?v=1790200506';
    import { createRules } from './rules.js?v=1790200506';

    // Взяття на проході — за бажанням, у налаштуваннях
    const rules = createRules({ enPassant: () => LG.store.get('pawns:ep', false) });
    startGame({
      rules,
      extraSettings: () => {
        const l = document.createElement('label');
        l.className = 'lg-set-row';
        l.innerHTML = `<span>Взяття на проході</span><input type="checkbox" ${LG.store.get('pawns:ep', false) ? 'checked' : ''}>`;
        l.querySelector('input').addEventListener('change', e => LG.store.set('pawns:ep', e.target.checked));
        return l;
      }
    });
  </script>
</body>
</html>
