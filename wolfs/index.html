<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Фігури й пішаки</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790199148">
  <link rel="stylesheet" href="../shared/play.css?v=1790199148">
  <link rel="stylesheet" href="../shared/pieces/extra.css?v=1790199148">
  <style>
    .lg-quick { flex-wrap: wrap; justify-content: center; max-width: min(100vw - 12px, 560px); box-sizing: border-box; }
    .lg-quick button { display: inline-flex; align-items: center; gap: 1px; min-width: 0; padding: 2px 5px; }
    .lg-quick mpiece { display: inline-block; width: 20px; height: 20px; background-size: cover; }
    .lg-quick small { font-size: 11px; font-weight: 900; margin: 0 1px; }
    .lg-quick button[aria-checked="true"] small { color: #fff; }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) { .lg-quick mpiece { width: 26px; height: 26px; } .lg-quick small { font-size: 13px; } }
  </style>
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790199148"></script>
  <script src="../shared/kit.js?v=1790199148" data-game="wolfs" data-night="on"></script>
  <script type="module">
    import { startGame } from '../shared/game.js?v=1790199148';
    import { createRules, MODES, modeButton, modeLabel } from './rules.js?v=1790199148';
    // Посилання з уроків: wolfs/#r_p5 — одразу потрібний режим
    const fromHash = location.hash.slice(1);
    if (MODES.some(m => m[0] === fromHash)) LG.store.set('wolfs:mode2', fromHash);
    startGame({
      rules: createRules({ mode: () => LG.store.get('wolfs:mode2', 'q_p8') }),
      player: 'b', // за замовчуванням дитина грає фігурами (чорними)
      quick: { key: 'wolfs:mode2', def: 'q_p8', options: MODES.map(m => [m[0], modeButton(m)]) }
    });
    document.querySelectorAll('.lg-quick button').forEach(b => { const m = MODES.find(x => x[0] === b.dataset.v); b.title = modeLabel(m); b.setAttribute('aria-label', modeLabel(m)); });
  </script>
</body>
</html>
