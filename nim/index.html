<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Нім</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790232892">
  <link rel="stylesheet" href="../shared/play.css?v=1790232892">
  <style>
    .lg-custom-view .lg-board-wrap { width: min(96vw, 480px); aspect-ratio: auto; height: min(100vw, 480px, calc(100svh - var(--lg-bar-h) - 16px - 44px - 120px - 50px - 24px)); }
    /* Сірники завжди вміщаються в поле: висота ряду ділиться на кількість рядів, кнопка «Взяти» — всередині поля */
    .nim-board { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px 10px; box-sizing: border-box; background: #8B5A2B; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 3px, transparent 3px 18px); border-radius: 22px; }
    .nim-rows { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; width: 100%; padding-top: 12px; box-sizing: border-box; }
    .nim-row { flex: 0 1 84px; min-height: 0; height: 84px; max-height: calc((100% - 12px * (var(--rows) - 1)) / var(--rows)); display: flex; justify-content: center; gap: clamp(6px, 2.6vw, 16px); }
    .nim-stick { position: relative; height: 100%; aspect-ratio: 26 / 84; border: 0; padding: 0; background: none; cursor: pointer; transition: transform .15s ease, opacity .3s ease; }
    .nim-stick::before { content: ''; position: absolute; left: 35%; top: 17%; bottom: 0; width: 30%; border-radius: 3px; background: #F5D7A1; box-shadow: inset -2px 0 0 #D9B278; }
    .nim-stick::after { content: ''; position: absolute; left: 19%; top: 0; width: 62%; height: 24%; border-radius: 50% 50% 45% 45%; background: #E0302E; box-shadow: inset -3px -3px 0 #B01E1C; }
    .nim-stick.sel { transform: translateY(-10px); }
    .nim-stick.sel::before { background: #FFE9B8; box-shadow: 0 0 0 3px #FFC928; }
    .nim-stick.gone { visibility: hidden; }
    .nim-stick.taken { visibility: visible; animation: nimgone .6s ease forwards; }
    @keyframes nimgone { to { transform: translateY(-40px) rotate(25deg); opacity: 0; } }
    .nim-stick.hinted::before { box-shadow: 0 0 0 4px #FF9F1C; }
    .nim-take { flex: none; min-width: 170px; min-height: 48px; border: 0; border-radius: 16px; background: #FFC928; color: #3b2a00; font: 900 20px var(--lg-font); box-shadow: 0 4px 0 #D9A400; cursor: pointer; }
    .nim-take[hidden] { visibility: hidden; display: block; }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) { html.lg .lg-play > .lg-board-wrap { height: var(--lg-bh); width: min(var(--lg-bh) * .85, var(--lg-bw)); } .nim-row { flex-basis: 150px; height: 150px; } }
  </style>
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790232892"></script>
  <script src="../shared/kit.js?v=1790232892" data-game="nim" data-night="on"></script>
  <script type="module">
    import { startGame, choice } from '../shared/game.js?v=1790232892';
    import { createRules } from './rules.js?v=1790232892';
    import { nimView } from './view.js?v=1790232892';
    let game;
    const again = () => game.newGame();
    game = startGame({
      rules: createRules({ misere: () => LG.store.get('nim:misere', '0') === '1', layout: () => LG.store.get('nim:rows', '1357') }),
      view: nimView,
      sideNames: { w: '🙂 Перший', b: '😎 Другий' },
      quick: { key: 'nim:rows', def: '1357', options: [['345', '3·4·5'], ['1357', '1·3·5·7'], ['23456', '2…6']] },
      extraSettings: () => {
        const w = document.createElement('div');
        w.append(
          choice('Хто взяв останню', 'nim:misere', '0', [['0', '🏆 виграв'], ['1', '🙈 програв']], again)(),
          choice('Ряди сірників', 'nim:rows', '1357', [['1357', '1 · 3 · 5 · 7'], ['345', '3 · 4 · 5'], ['23456', '2 · 3 · 4 · 5 · 6']], again)()
        );
        return w;
      }
    });
  </script>
</body>
</html>
