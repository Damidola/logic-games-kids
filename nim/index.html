<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Остання сірника</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790181158">
  <link rel="stylesheet" href="../shared/play.css?v=1790181158">
  <style>
    .lg-custom-view .lg-board-wrap { width: min(96vw, 480px); aspect-ratio: auto; }
    .nim-board { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 8px; box-sizing: border-box; background: #8B5A2B; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 3px, transparent 3px 18px); border-radius: 22px; }
    .nim-rows { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
    .nim-row { display: flex; justify-content: center; gap: clamp(8px, 3vw, 16px); min-height: 84px; }
    .nim-stick { position: relative; width: 26px; height: 84px; border: 0; padding: 0; background: none; cursor: pointer; transition: transform .15s ease, opacity .3s ease; }
    .nim-stick::before { content: ''; position: absolute; left: 9px; top: 14px; bottom: 0; width: 8px; border-radius: 3px; background: #F5D7A1; box-shadow: inset -2px 0 0 #D9B278; }
    .nim-stick::after { content: ''; position: absolute; left: 5px; top: 0; width: 16px; height: 20px; border-radius: 50% 50% 45% 45%; background: #E0302E; box-shadow: inset -3px -3px 0 #B01E1C; }
    .nim-stick.sel { transform: translateY(-12px); }
    .nim-stick.sel::before { background: #FFE9B8; box-shadow: 0 0 0 3px #FFC928; }
    .nim-stick.gone { visibility: hidden; }
    .nim-stick.taken { visibility: visible; animation: nimgone .6s ease forwards; }
    @keyframes nimgone { to { transform: translateY(-40px) rotate(25deg); opacity: 0; } }
    .nim-stick.hinted::before { box-shadow: 0 0 0 4px #FF9F1C; }
    .nim-take { min-width: 170px; min-height: 48px; border: 0; border-radius: 16px; background: #FFC928; color: #3b2a00; font: 900 20px var(--lg-font); box-shadow: 0 4px 0 #D9A400; cursor: pointer; }
    .nim-take[hidden] { visibility: hidden; display: block; }
  </style>
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790181158"></script>
  <script src="../shared/kit.js?v=1790181158" data-game="nim" data-night="on"></script>
  <script type="module">
    import { startGame, choice } from '../shared/game.js?v=1790181158';
    import { createRules } from './rules.js?v=1790181158';
    import { nimView } from './view.js?v=1790181158';
    let game;
    const again = () => game.newGame();
    game = startGame({
      rules: createRules({ misere: () => LG.store.get('nim:misere', '0') === '1', layout: () => LG.store.get('nim:rows', '1357') }),
      view: nimView,
      sideNames: { w: '🙂 Перший', b: '😎 Другий' },
      quick: { key: 'nim:rows', def: '1357', options: [['345', '3·4·5'], ['1357', '1·3·5·7'], ['23456', '2…6']] },
      extraSettings: () => {
        const w = document.createElement('div');
        w.append(
          choice('Хто взяв останню', 'nim:misere', '0', [['0', '🏆 виграв'], ['1', '🙈 програв']], again)(),
          choice('Ряди сірників', 'nim:rows', '1357', [['1357', '1 · 3 · 5 · 7'], ['345', '3 · 4 · 5'], ['23456', '2 · 3 · 4 · 5 · 6']], again)()
        );
        return w;
      }
    });
  </script>
</body>
</html>
