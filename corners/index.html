<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Кути</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790196281">
  <link rel="stylesheet" href="../shared/play.css?v=1790196281">
  <link rel="stylesheet" href="../shared/pieces/extra.css?v=1790196281">
</head>
<body>
  <main></main>
  <script src="../shared/games.js?v=1790196281"></script>
  <script src="../shared/kit.js?v=1790196281" data-game="corners" data-night="on"></script>
  <script type="module">
    import { startGame } from '../shared/game.js?v=1790196281';
    import { createRules } from './rules.js?v=1790196281';
    const choice = (label, key, def, options, onChange) => () => {
      const row = document.createElement('div'); row.className = 'lg-set-row';
      row.innerHTML = `<span>${label}</span><select>${options.map(([v, t]) => `<option value="${v}" ${v === LG.store.get(key, def) ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
      row.querySelector('select').addEventListener('change', e => { LG.store.set(key, e.target.value); onChange(); });
      return row;
    };
    let game;
    game = startGame({
      rules: createRules({ shape: () => LG.store.get('corners:shape', 'triangle') }),
      extraSettings: choice('Будиночок', 'corners:shape', 'triangle', [['triangle', '🔺 Трикутник (10 шашок)'], ['square', '🟦 Квадрат (9 шашок)']], () => game.newGame())
    });
  </script>
</body>
</html>
