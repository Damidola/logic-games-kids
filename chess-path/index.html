<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Шахи — шлях новачка</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790427876">
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: var(--lg-font); color: var(--lg-ink); background: var(--lg-bg); }
    /* Змійка знизу вгору: крок 1 — унизу; сторінка відкривається на поточному кроці */
    .cp { display: flex; flex-direction: column-reverse; align-items: center; max-width: 520px; margin: 0 auto; padding: 24px 12px 40px; box-sizing: border-box; }
    .cp-node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 6px 0; width: 150px;
      transform: translateX(var(--x)); background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--lg-font); color: var(--lg-ink); }
    .cp-dot { width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px;
      background: var(--sec); box-shadow: inset 0 -7px 0 rgba(0,0,0,.22), 0 5px 0 rgba(0,0,0,.25); transition: transform .1s; }
    .cp-dot img { width: 50px; height: 50px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
    .cp-node:active .cp-dot { transform: translateY(4px); box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
    .cp-node b { font-size: 14px; font-weight: 900; line-height: 1.1; text-align: center; }
    .cp-node.done .cp-dot::after { content: '✓'; position: absolute; top: -2px; right: 36px; width: 24px; height: 24px; border-radius: 50%; background: #2ECC9A; color: #fff; font: 900 15px/24px var(--lg-font); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .cp-node.cur .cp-dot { outline: 5px solid #fff; outline-offset: 4px; animation: cppulse 1.4s ease-in-out infinite; }
    @keyframes cppulse { 50% { outline-color: rgba(255,255,255,.35); } }
    .cp-node.cur::before { content: 'Ти тут'; position: absolute; top: 24px; left: calc(50% + 46px); padding: 3px 10px; border-radius: 10px; background: #fff; color: #1d1b30; font: 900 12px var(--lg-font); white-space: nowrap; }
    .cp-sec { margin: 18px 0 6px; padding: 5px 14px; border-radius: 999px; background: var(--sec); color: #fff; font: 900 13px var(--lg-font); letter-spacing: .5px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
    /* аркуш кроку */
    .cp-sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); }
    .cp-sheet[hidden] { display: none; }
    .cp-card { width: min(100%, 520px); box-sizing: border-box; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: var(--lg-surface); }
    .cp-card h2 { margin: 0 0 4px; font: 900 22px var(--lg-font); }
    .cp-card p { margin: 0 0 12px; font: 700 14px/1.35 var(--lg-font); color: var(--lg-muted); }
    .cp-card a { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 13px 14px; border-radius: 14px; text-decoration: none; color: var(--lg-ink);
      background: var(--lg-surface-2, rgba(255,255,255,.06)); border: 2px solid var(--lg-line); font: 900 16px var(--lg-font); box-shadow: 0 3px 0 var(--lg-line); }
    .cp-card a.seen::after { content: '✓'; margin-left: auto; color: #2ECC9A; }
    .cp-card a.t-play { border-color: #2ECC9A; } .cp-card a.t-task { border-color: #FF9F1C; }
  </style>
</head>
<body>
  <main class="cp" id="path"></main>
  <div class="cp-sheet" id="sheet" hidden><div class="cp-card" id="card"></div></div>
  <script src="../shared/games.js?v=1790427876"></script>
  <script src="../shared/kit.js?v=1790427876" data-game="path" data-night="on"></script>
  <script>
  (function () {
    // Шлях новачка: кроки зі старих розділів сайту (уроки Lichess, власні міні-уроки, задачі, практика, гра з роботом)
    const L = n => '../learn-chess/index.html#/' + n;          // етап уроків Lichess
    const LS = k => 'lesson.html#' + k;                         // наш міні-урок
    const P = k => '../chess-puzzles/index.html#' + k;          // розділ задач
    const W = k => '../pieces-vs-pawns/index.html#' + k;        // фігури проти пішаків
    // Розділи шляху: [з якого кроку, назва, колір]
    const SECTIONS = [[0, '♟️ Фігури', '#6C5CE7'], [6, '⚔️ Напад і захист', '#FF9F1C'], [10, '👑 Шах і мат', '#E74C3C'], [15, '✨ Особливі ходи й дебют', '#2ECC9A'], [18, '🏆 Майстер', '#3498DB']];
    const STEPS = [
      ['P', 'Пішак', 'Ходить уперед, б’є навскоси. І одразу — перша перемога!', [['📖', 'Урок', L(6)], ['🎮', 'Пішакова битва', '../pawns/index.html', 'play']]],
      ['R', 'Тура', 'Ходить прямо на скільки завгодно клітинок.', [['📖', 'Урок', L(1)], ['🎮', 'Тура проти 5 пішаків', W('r_p5'), 'play']]],
      ['B', 'Слон', 'Ходить навскоси і не міняє колір клітинок.', [['📖', 'Урок', L(2)], ['🎮', 'Слон проти 3 пішаків', W('b_p3'), 'play']]],
      ['Q', 'Ферзь', 'Тура + слон разом — найсильніша фігура.', [['📖', 'Урок', L(3)], ['🎮', 'Ферзь проти 8 пішаків', W('q_p8'), 'play']]],
      ['N', 'Кінь', 'Стрибає літерою «Г»: два прямо, один убік.', [['📖', 'Урок', L(5)], ['🎮', 'Кінь проти 3 пішаків', W('n_p3'), 'play']]],
      ['K', 'Король', 'Найважливіша фігура: ходить на одну клітинку.', [['📖', 'Урок', L(4)]]],
      ['⚔️', 'Напад', 'Постав фігуру так, щоб наступним ходом побити.', [['📖', 'Урок', LS('attack')]]],
      ['🍽️', 'Бий беззахисні', 'Забирай фігури, які ніхто не захищає.', [['📖', 'Урок', L(7)], ['🧩', 'Задачі', P('hanging'), 'task']]],
      ['🛡️', 'Захист', 'Напали на твою фігуру? Захисти її!', [['📖', 'Урок', LS('protect')], ['📖', 'Захист', L(8)], ['🎮', 'Битва', L(9), 'play']]],
      ['💰', 'Цінність фігур', 'Пішак 1, кінь і слон 3, тура 5, ферзь 9.', [['📖', 'Урок', '../learn-chess/value.html']]],
      ['⚠️', 'Шах', 'Напад на короля і три способи врятуватися.', [['📖', 'Урок', '../learn-chess/check.html'], ['🧩', 'Постав шах', P('chk_rook'), 'task'], ['🧩', 'Урятуйся', P('esc_mixed'), 'task']]],
      ['🏁', 'Мат', 'Шах, від якого нікуди подітися. Відомі мати.', [['📖', 'Урок', L(12)], ['📖', 'Відомі мати', LS('mates')], ['🧩', 'Мат в 1 хід', P('m1rook'), 'task'], ['🧩', 'Різні', P('m1mix'), 'task']]],
      ['♜', 'Мат двома турами', 'Тури по черзі заганяють короля до краю — «драбинка».', [['📖', 'Урок', LS('rooks')]]],
      ['♛', 'Мат ферзем', 'Ферзь заганяє, король допомагає.', [['📖', 'Урок', LS('queen')], ['🎮', 'Практика', P('kqk'), 'play']]],
      ['🤝', 'Пат і нічия', 'Коли ніхто не виграв — і як не зробити пат.', [['📖', 'Урок', LS('draw')], ['📖', 'Пат', L(16)]]],
      ['👑', 'Перетворення і взяття на проході', 'Пішак стає ферзем. І особливий хід пішака.', [['📖', 'Урок', LS('promo')], ['📖', 'На проході', L(15)], ['🎮', 'Король і пішак', P('kpk'), 'play']]],
      ['🏰', 'Рокіровка', 'Сховай короля й виведи туру.', [['📖', 'Урок', L(14)]]],
      ['🚀', 'Дебют', 'Як починати гру: центр, фігури, рокіровка.', [['📖', 'Розстановка', L(13)], ['📖', 'Правила дебюту', LS('opening')]]],
      ['🍴', 'Тактика', 'Вилка, зв’язка, прострел та інші прийоми.', [['🧩', 'Вилка', P('fork'), 'task'], ['🧩', 'Зв’язка', P('pin'), 'task'], ['🧩', 'Прострел', P('skewer'), 'task'], ['🧩', 'Відкритий напад', P('discovered'), 'task']]],
      ['🏆', 'Мат у 2 ходи', 'Хід, відповідь суперника — і мат.', [['🧩', 'Задачі', P('mate2'), 'task']]],
      ['⭐', 'Бонус', 'Головоломки з фігурами.', [['🎮', 'Хід конем', '../knights-tour/index.html', 'play'], ['🎮', '8 ферзів', '../eight-queens/index.html', 'play']]],
      ['K', 'Шахи з роботом', 'Справжня партія! Обери рівень і колір.', [['🎮', 'Грати', '../chess/index.html', 'play']]]
    ];
    try { sessionStorage.setItem('lg:back', location.href.split('#')[0]); } catch (e) { /* без сховища */ }
    const seen = new Set(LG.store.get('path:seen', []));
    const set = LG.pieceSet ? LG.pieceSet() : 'cburnett';
    const icon = ic => /^[PRBQNK]$/.test(ic) ? `<img src="../shared/pieces/${set}/w${ic}.svg" alt="">` : ic;
    const X = [0, 55, 85, 55, 0, -55, -85, -55]; // зигзаг змійки
    let cur = -1;
    const secOf = i => SECTIONS.filter(x => x[0] <= i).pop();
    const done = i => STEPS[i][3].every(l => seen.has(l[2]));
    STEPS.forEach((_, i) => { if (cur < 0 && !done(i)) cur = i; });
    if (cur < 0) cur = STEPS.length - 1;
    // column-reverse: перший елемент — унизу
    document.getElementById('path').innerHTML = STEPS.map(([ic, title], i) => {
      const sec = secOf(i);
      const node = `<button type="button" class="cp-node${done(i) ? ' done' : ''}${i === cur ? ' cur' : ''}" id="s${i + 1}" data-i="${i}" style="--x:${X[i % X.length]}px;--sec:${sec[2]}">
        <span class="cp-dot">${icon(ic)}</span><b>${title}</b></button>`;
      return (sec[0] === i ? `<div class="cp-sec" style="--sec:${sec[2]}">${sec[1]}</div>` : '') + node;
    }).join('');
    const sheet = document.getElementById('sheet'), card = document.getElementById('card');
    function open(i) {
      const [, title, sub, links] = STEPS[i];
      card.innerHTML = `<h2>${i + 1}. ${title}</h2><p>${sub}</p>` +
        links.map(([e, t, href, kind]) => `<a class="t-${kind || 'learn'}${seen.has(href) ? ' seen' : ''}" href="${href}">${e} ${t}</a>`).join('');
      sheet.hidden = false;
    }
    document.getElementById('path').addEventListener('click', e => { const n = e.target.closest('.cp-node'); if (n) open(+n.dataset.i); });
    sheet.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (a) { seen.add(a.getAttribute('href')); LG.store.set('path:seen', [...seen]); try { sessionStorage.setItem('lg:path-step', cur); } catch (x) { /* */ } return; }
      if (e.target === sheet) sheet.hidden = true;
    });
    // відкриваємо сторінку на поточному кроці
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    const scroll = () => document.getElementById('s' + (cur + 1))?.scrollIntoView({ block: 'center' });
    scroll(); requestAnimationFrame(scroll); window.addEventListener('load', () => setTimeout(scroll, 50));
  })();
  </script>
</body>
</html>
