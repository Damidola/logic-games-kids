<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Шахові задачі</title>
  <link rel="stylesheet" href="../shared/kit.css?v=1790255423">
  <link rel="stylesheet" href="../shared/play.css?v=1790255423">
  <style>
    .mt { justify-content: center; gap: 8px; }
    .mt-goal { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; font: 900 16px var(--lg-font); color: var(--lg-ink); min-height: 30px; text-align: center; }
    .mt-count:empty { display: none; }
    .mt-lives { letter-spacing: 2px; font-size: 15px; }
    .mt-count { padding: 3px 10px; border-radius: 999px; background: var(--lg-surface); border: 2px solid var(--lg-line); font-size: 14px; }
    .mt-side { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #1d1b30; background: #fff; vertical-align: -2px; box-sizing: border-box; }
    .mt-side.b { background: #1d1b30; border-color: #fff; }
    .mt .lg-board-wrap { width: min(100vw, 560px, calc(100svh - var(--lg-bar-h) - 16px - 40px - 60px - 30px - 30px)); }
    .mt .lg-board-wrap.solved cg-board { box-shadow: 0 0 0 5px #2ECC9A; }
    .mt .lg-board-wrap.wrong cg-board { animation: mtshake .35s ease; }
    @keyframes mtshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .mt-task { min-height: 22px; max-width: min(100%, 520px); padding: 0 12px; box-sizing: border-box; text-align: center; font: 800 15px/1.3 var(--lg-font); color: var(--lg-ink); }
    .mt-task.say { color: #FF9F1C; }
    .mt-promo { position: absolute; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); }
    .mt-promo button { position: absolute; width: 12.5%; height: 12.5%; padding: 0; border: 0; border-radius: 50%; background: #b0b0b0; box-shadow: inset 0 0 12px rgba(0,0,0,.4); cursor: pointer; }
    .mt-promo button:hover { background: #d59120; border-radius: 0; }
    .mt-promo mpiece { display: block; width: 100%; height: 100%; background-size: cover; }
    .mt .lg-controls { grid-template-columns: repeat(4, 1fr); width: min(100%, 480px); }
    .mt[data-mode="puzzle"] .lg-controls { grid-template-columns: repeat(5, 1fr); }
    .mt:not([data-mode="puzzle"]) .mt-prev, .mt:not([data-mode="puzzle"]) .mt-ex { display: none; }
    .mt-ex { padding: 3px 10px; border-radius: 999px; border: 2px solid var(--lg-line); background: var(--lg-surface); color: var(--lg-ink); font: 800 13px var(--lg-font); cursor: pointer; }
    .mt[data-mode="example"] .lg-controls { grid-template-columns: repeat(3, 1fr); }
    .mt[data-mode="example"] #show { display: none; }
    .mt[data-mode="example"] #next { box-shadow: 0 0 0 3px #2ECC9A; }
    .mt[data-mode="example"] .mt-task { min-height: 40px; font-size: 16px; }

    /* ---------- список розділів ---------- */
    .mt-menu { flex: 1 1 auto; min-height: 0; width: 100%; max-width: 760px; overflow-y: auto; padding: 4px 12px 16px; box-sizing: border-box; touch-action: pan-y; }
    .mt-menu h2 { margin: 14px 4px 8px; font: 900 19px var(--lg-font); color: var(--lg-ink); }
    .mt-menu h2:first-child { margin-top: 2px; }
    .mt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
    .mt-card { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 4px 10px; min-height: 64px; padding: 8px 12px; text-align: left; border-radius: 16px; border: 2px solid var(--lg-line); background: var(--lg-surface); color: var(--lg-ink); font-family: var(--lg-font); box-shadow: var(--lg-btn-shadow); cursor: pointer; }
    .mt-card:active { transform: scale(.97); }
    .mt-card .ic { grid-row: span 2; font-size: 30px; text-align: center; }
    .mt-card .ic mpiece, .mt-goal mpiece { display: inline-block; width: 40px; height: 40px; background-size: cover; vertical-align: middle; }
    .mt-goal mpiece { width: 28px; height: 28px; }
    .mt-card b { font-size: 16px; font-weight: 900; }
    .mt-card small { grid-column: 2; font-size: 12px; font-weight: 700; color: var(--lg-muted); line-height: 1.2; }
    .mt-card .pr { grid-row: 1 / span 2; grid-column: 3; font-size: 13px; font-weight: 900; color: var(--lg-muted); white-space: nowrap; }
    .mt-card .pr.all { color: var(--lg-mint); }
    .mt[data-mode="menu"] > :not(.mt-menu) { display: none !important; }
    .mt:not([data-mode="menu"]) > .mt-menu { display: none; }
    @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
      html.lg .lg-play.mt[data-mode="menu"] { display: flex; width: 100%; }
      html.lg .lg-play.mt > .mt-menu { max-width: 1000px; margin: 0 auto; }
      .mt-list { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
      html.lg .lg-play.mt > .mt-goal { font-size: 19px; }
      html.lg .lg-play.mt > .lg-controls { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="lg-play mt" data-mode="menu">
    <section class="mt-menu" id="menu" aria-label="Розділи задач"></section>
    <div class="mt-goal"><span id="goal"></span><span class="mt-lives" id="lives"></span><span class="mt-count" id="count"></span><button type="button" class="mt-ex" id="ex" title="Приклад">📖 Приклад</button></div>
    <div class="lg-board-wrap" id="wrap"><div class="lg-board-el" id="board"></div></div>
    <div class="mt-task" id="task"></div>
    <div class="lg-controls">
      <button type="button" id="list"><span class="ico">📋</span><span class="lbl">Розділи</span></button>
      <button type="button" id="hint"><span class="ico">💡</span><span class="lbl">Підказка</span></button>
      <button type="button" id="show"><span class="ico">👀</span><span class="lbl">Розв’язок</span></button>
      <button type="button" id="prev" class="mt-prev"><span class="ico">◀️</span><span class="lbl">Попередня</span></button>
      <button type="button" id="next"><span class="ico">▶️</span><span class="lbl">Далі</span></button>
    </div>
  </main>
  <script src="../shared/games.js?v=1790255423"></script>
  <script src="../shared/kit.js?v=1790255423" data-game="mate" data-night="on"></script>
  <script type="module" src="mate.js?v=1790255423"></script>
</body>
</html>
